<!-- title: Code input (.o-code) -->
<div class="o-stack o-stack--sm">
  <label class="o-label" for="demo-otp">Authenticator code</label>
  <input class="o-input o-code" id="demo-otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" placeholder="000000">
  <label class="o-label" for="demo-rec">Recovery code</label>
  <input class="o-input o-code o-code--wide" id="demo-rec" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
</div>
