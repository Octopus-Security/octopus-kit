<!-- title: File dropzone (.o-dropzone) -->
<label class="o-dropzone">
  <input class="o-dropzone__input" type="file" accept="image/*" aria-describedby="demo-dz-hint">
  <span class="o-dropzone__title">Drop a file here or tap to choose</span>
  <span class="o-dropzone__hint" id="demo-dz-hint">PNG or JPG, up to 5 MB</span>
  <span class="o-dropzone__files" aria-live="polite"></span>
</label>
