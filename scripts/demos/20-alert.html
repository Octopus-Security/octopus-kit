<!-- title: Alert / callout (.o-alert) -->
<div class="o-stack o-stack--sm">
  <div class="o-alert" role="status"><div class="o-alert__body"><strong class="o-alert__title">Heads up.</strong> A plain note, tinted with the info tone.</div></div>
  <div class="o-alert o-alert--success" role="status"><div class="o-alert__body">Settings saved.</div></div>
  <div class="o-alert o-alert--warn" role="alert"><div class="o-alert__body"><strong class="o-alert__title">Not advice.</strong> General information only; check with a professional.</div></div>
  <div class="o-alert o-alert--danger" role="alert">
    <div class="o-alert__body"><strong class="o-alert__title">Could not save.</strong> Weight must be a number.</div>
    <div class="o-alert__actions"><button class="o-btn o-btn--sm" type="button">Retry</button></div>
  </div>
</div>
