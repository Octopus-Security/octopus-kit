<!-- title: Meter (.o-meter) -->
<div class="o-stack">
  <div class="o-meter"><div class="o-meter__head"><label class="o-meter__label" for="demo-m1">Upload</label><span class="o-meter__value">42%</span></div><progress class="o-meter__bar" id="demo-m1" value="42" max="100"></progress></div>
  <div class="o-meter o-meter--warn"><div class="o-meter__head"><label class="o-meter__label" for="demo-m2">Monthly budget</label><span class="o-meter__value">$18 of $25</span></div><progress class="o-meter__bar" id="demo-m2" value="18" max="25"></progress></div>
  <div class="o-meter o-meter--danger o-meter--sm"><div class="o-meter__head"><label class="o-meter__label" for="demo-m3">Disk</label><span class="o-meter__value">96%</span></div><progress class="o-meter__bar" id="demo-m3" value="96" max="100"></progress></div>
  <div class="o-meter o-meter--success"><div class="o-meter__head"><label class="o-meter__label" for="demo-m4">Working</label></div><progress class="o-meter__bar" id="demo-m4" aria-label="Working"></progress></div>
</div>
