# kit host: serves the octopus-kit LIVE CHANNEL (/v0/...) as static files.
#
# CORS: fonts and module scripts are fetched cross-origin, so the browser needs
# Access-Control-Allow-Origin. Only *.octopustechnology.net (and the bare domain) is echoed back;
# any other Origin gets no ACAO header and the browser blocks the module/font. The response varies
# by Origin, which a CDN cache ignores -- so Cloudflare must BYPASS cache for this host
# (docs/delivery.md, owner step). That is also what makes a release visible at once.
map $http_origin $kit_cors_origin {
  default "";
  "~^https://([a-z0-9-]+\.)*octopustechnology\.net$" $http_origin;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  # add_header inside a location REPLACES the server-level ones, so each location repeats them.

  location = /health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"status":"ok","service":"octopus-kit-host"}';
  }

  # Written into the image by the Dockerfile. Never cache a deploy check.
  location = /api/build {
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Content-hashed copies: the path IS the content, so they can never go stale.
  location ^~ /v0/_/ {
    add_header Access-Control-Allow-Origin $kit_cors_origin always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Stable URLs: what apps link. Revalidate every time (ETag makes that a cheap 304).
  location ^~ /v0/ {
    add_header Access-Control-Allow-Origin $kit_cors_origin always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / { return 404; }
}
